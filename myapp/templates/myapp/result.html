
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
           background-image: url("{% static 'images/login-page.jpg' %}");
           background-size: cover;
           background-position: center;
           background-repeat: no-repeat;
           height: 100vh;
           display: flex;
           justify-content: center;
           align-items: center;
       }
   </style>
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-lg text-center" style="width: 400px;">
            <h2>Prediction Result</h2>
            <p class="fw-bold">The patient: <strong>{{ result }}</strong></p>
            <a href="{% url 'predict' %}" class="btn btn-secondary w-100">Try Another Prediction</a>
            <a href="{% url 'index' %}" class="btn btn-primary w-100 mt-2">Go to Dashboard</a>
        </div>
    </div>
</body>
</html>
