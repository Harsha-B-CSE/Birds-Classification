<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Classification</title>
    <style>
        /* 🌿 Background Styling */
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background: url('https://source.unsplash.com/1600x900/?birds,nature') no-repeat center center fixed;
            background-size: cover;
            padding: 50px;
            color: white;
        }

        /* 🟢 Upload Section */
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            display: inline-block;
            max-width: 450px;
            width: 100%;
        }

        h2 {
            margin-bottom: 20px;
            color: #FFD700; /* Golden color */
        }

        input[type="file"], button {
            margin-top: 10px;
            padding: 12px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            width: 100%;
        }

        button {
            background-color: #FF5733; /* Orange-Red for a nature feel */
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #C70039;
        }

        /* ✅ Prediction Results */
        .result {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            color: white;
        }

        /* ❌ Error Message */
        .error {
            color: #FF5733;
            font-weight: bold;
            margin-top: 20px;
        }

        /* 🦜 Image Styling */
        img {
            margin-top: 10px;
            border-radius: 10px;
            max-width: 100%;
            height: auto;
            border: 3px solid white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🦜 Bird Classification</h2>

        <!-- 📂 Upload Form -->
        <form action="{% url 'upload_image' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="image" required>
            <br>
            <button type="submit">Upload & Predict</button>
        </form>

        <!-- ✅ Display Prediction Results -->
        {% if bird_name %}
            <div class="result">
                <h3>Predicted Bird: <strong>{{ bird_name }}</strong></h3>
                <p>Confidence: <strong>{{ confidence }}%</strong></p>
                <img src="{{ image_path }}" alt="Uploaded Bird Image" width="300">
            </div>
        {% endif %}

        <!-- ❌ Display Error Messages -->
        {% if error %}
            <p class="error">⚠️ {{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
